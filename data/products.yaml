# Catálogo de recomendações (afiliados).
# Regra editorial: só descrevemos para que o produto serve e para quem faz sentido.
# Nunca inventamos preço, nota, teste ou experiência pessoal. Preço e avaliações ficam na loja.
# Para cada loja, use o link de produto específico quando tiver; a busca é o padrão provisório.
items:
  - id: cama-ortopedica
    name: Cama ortopédica com espuma de alta densidade
    for: Cães idosos, raças grandes e cães com articulações sensíveis.
    why: Distribui o peso do corpo e evita que o cão afunde até tocar o chão.
    search: cama ortopedica cachorro espuma
  - id: cama-ninho
    name: Cama ninho com borda alta
    for: Cães que dormem enrolados e gostam de apoiar a cabeça.
    why: A borda dá sensação de abrigo e serve de travesseiro.
    search: cama ninho cachorro borda alta
  - id: colchonete-impermeavel
    name: Colchonete com capa impermeável e removível
    for: Filhotes, cães idosos e casas com área externa.
    why: A capa sai para lavar e a espuma não absorve xixi nem umidade.
    search: colchonete cachorro capa impermeavel removivel
  - id: kong-recheavel
    name: Brinquedo recheável de borracha resistente
    for: Cães que ficam sozinhos ou que mastigam muito.
    why: Rechear e congelar prolonga a atividade e ocupa a mente.
    search: brinquedo recheavel cachorro borracha
  - id: tapete-lamber
    name: Tapete de lamber com ventosa
    for: Cães ansiosos e momentos como banho ou corte de unhas.
    why: Lamber é uma atividade calmante; o tapete espalha o petisco e prolonga a tarefa.
    search: tapete de lamber cachorro
  - id: tapete-farejar
    name: Tapete de farejar (snuffle mat)
    for: Cães que comem rápido demais ou se entediam em casa.
    why: Transforma a refeição em busca pelo faro, o sentido mais forte do cão.
    search: tapete farejador cachorro
  - id: comedouro-lento
    name: Comedouro lento (slow feeder)
    for: Cães que engolem a ração em segundos.
    why: Os relevos obrigam o cão a comer mais devagar.
    search: comedouro lento cachorro
  - id: portao-pet
    name: Portãozinho de segurança para pets
    for: Casas com escada, filhotes e convivência com bebês.
    why: Cria áreas seguras sem trancar o cão em um cômodo.
    search: portao seguranca pet escada
  - id: caixa-transporte
    name: Caixa de transporte ventilada
    for: Viagens, idas ao veterinário e gatos.
    why: Uma caixa conhecida e confortável reduz o estresse do deslocamento.
    search: caixa transporte pet
  - id: arranhador
    name: Arranhador vertical alto e firme
    for: Gatos de todas as idades.
    why: Arranhar é necessidade do gato; um arranhador estável poupa o sofá.
    search: arranhador gato vertical
