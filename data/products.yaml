# Catálogo de recomendações (afiliados).
# Regra editorial: só descrevemos para que o produto serve e para quem faz sentido.
# Nunca inventamos preço, nota, teste ou experiência pessoal. Preço e avaliações ficam na loja.
# Para cada loja, use o link de produto específico quando tiver; a busca é o padrão provisório.
items:
  - id: cama-ortopedica
    name: Cama ortopédica com espuma de alta densidade
    for: Cães idosos, raças grandes e cães com articulações sensíveis.
    why: Distribui o peso do corpo e evita que o cão afunde até tocar o chão.
    search: cama ortopedica cachorro espuma
  - id: cama-ninho
    name: Cama ninho com borda alta
    for: Cães que dormem enrolados e gostam de apoiar a cabeça.
    why: A borda dá sensação de abrigo e serve de travesseiro.
    search: cama ninho cachorro borda alta
  - id: colchonete-impermeavel
    name: Colchonete com capa impermeável e removível
    for: Filhotes, cães idosos e casas com área externa.
    why: A capa sai para lavar e a espuma não absorve xixi nem umidade.
    search: colchonete cachorro capa impermeavel removivel
  - id: kong-recheavel
    name: Brinquedo recheável de borracha resistente
    for: Cães que ficam sozinhos ou que mastigam muito.
    why: Rechear e congelar prolonga a atividade e ocupa a mente.
    search: brinquedo recheavel cachorro borracha
  - id: tapete-lamber
    name: Tapete de lamber com ventosa
    for: Cães ansiosos e momentos como banho ou corte de unhas.
    why: Lamber é uma atividade calmante; o tapete espalha o petisco e prolonga a tarefa.
    search: tapete de lamber cachorro
  - id: tapete-farejar
    name: Tapete de farejar (snuffle mat)
    for: Cães que comem rápido demais ou se entediam em casa.
    why: Transforma a refeição em busca pelo faro, o sentido mais forte do cão.
    search: tapete farejador cachorro
  - id: comedouro-lento
    name: Comedouro lento (slow feeder)
    for: Cães que engolem a ração em segundos.
    why: Os relevos obrigam o cão a comer mais devagar.
    search: comedouro lento cachorro
  - id: portao-pet
    name: Portãozinho de segurança para pets
    for: Casas com escada, filhotes e convivência com bebês.
    why: Cria áreas seguras sem trancar o cão em um cômodo.
    search: portao seguranca pet escada
  - id: caixa-transporte
    name: Caixa de transporte ventilada
    for: Viagens, idas ao veterinário e gatos.
    why: Uma caixa conhecida e confortável reduz o estresse do deslocamento.
    search: caixa transporte pet
  - id: arranhador
    name: Arranhador vertical alto e firme
    for: Gatos de todas as idades.
    why: Arranhar é necessidade do gato; um arranhador estável poupa o sofá.
    search: arranhador gato vertical

  # ---- Achadinhos do Focinho: produtos específicos com link de afiliado Mercado Livre
  # Links conferidos em 24/11/2026 (os mesmos usados nos Shorts do canal). Preço fica na loja.
  - id: ml-tapete-coletor-areia
    name: Tapete coletor para caixa de areia
    for: Casas com gato que espalha areia ao sair da caixa.
    why: Os relevos seguram os grãos presos nas patas e o tapete é fácil de sacudir e lavar.
    group: gatos
    links: {Mercado Livre: "https://meli.la/2XfSZaU"}
  - id: ml-fonte-agua
    name: Fonte de água com filtro (1,5 L, USB)
    for: Gatos que bebem pouca água ou preferem água corrente.
    why: "A água em movimento atrai muitos gatos; o filtro precisa de limpeza e troca regular."
    group: gatos
    links: {Mercado Livre: "https://meli.la/2dnErNg"}
  - id: ml-areia-mandioca
    name: Areia de mandioca biodegradável (4 kg)
    for: Tutores que querem areia vegetal, que forma torrões e pode ser descartada com menos impacto.
    why: "Troque aos poucos, misturando com a areia antiga: muitos gatos estranham mudança brusca."
    group: gatos
    links: {Mercado Livre: "https://meli.la/2LPLKHH"}
  - id: ml-varinha-gato
    name: Kit de varinhas e brinquedos interativos para gato
    for: Gatos de apartamento que caçam os pés e os objetos da casa.
    why: Sessões curtas de caça com varinha gastam energia e reduzem a caça a coisas proibidas.
    group: gatos
    links: {Mercado Livre: "https://meli.la/1umXznJ"}
  - id: ml-tunel-gato
    name: Túnel dobrável para gatos
    for: Gatos que gostam de se esconder e de brincar de emboscada.
    why: Esconderijo é necessidade do gato; o túnel vira abrigo e brinquedo ao mesmo tempo.
    group: gatos
    links: {Mercado Livre: "https://meli.la/2vG5ddH"}
  - id: ml-sache-gato
    name: Sachês de alimento úmido para gato adulto
    for: Gatos que bebem pouca água, como complemento da alimentação.
    why: O alimento úmido aumenta a ingestão de água. Mudanças na dieta devem ser feitas com orientação veterinária.
    group: gatos
    links: {Mercado Livre: "https://meli.la/1PKZVU2"}
  - id: ml-kit-mordedores
    name: Kit com 6 mordedores para filhote
    for: Filhotes na troca de dentes que mordem móveis, sapatos e mãos.
    why: Oferecer alternativas permitidas e trocar o objeto proibido pelo mordedor ensina o que pode morder.
    group: caes
    links: {Mercado Livre: "https://meli.la/2ceWcnZ"}
  - id: ml-tapete-higienico
    name: Tapete higiênico para cães (50 unidades)
    for: Filhotes aprendendo onde fazer xixi e cães que ficam muito tempo em apartamento.
    why: Um lugar fixo e fácil de identificar ajuda o filhote a acertar; recompense sempre que ele usar.
    group: caes
    links: {Mercado Livre: "https://meli.la/2hTKmSw"}
  - id: ml-caminha-impermeavel
    name: Caminha impermeável com zíper (cão pequeno e gato)
    for: Filhotes, pets idosos e quem precisa lavar a capa com frequência.
    why: A capa impermeável sai pelo zíper e protege a espuma de xixi e umidade.
    group: casa
    links: {Mercado Livre: "https://meli.la/26v6duA"}
  - id: ml-pote-racao
    name: Pote hermético para ração (2,5 L, com medidor)
    for: Quem compra ração em saco grande.
    why: Guardar a ração no saco original dentro do pote fechado ajuda a manter o alimento protegido de ar e umidade.
    group: casa
    links: {Mercado Livre: "https://meli.la/27S6fZz"}
